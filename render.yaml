services:
  - type: web
    name: hotel-feedback-platform
    runtime: node
    plan: free
    rootDir: .
    buildCommand: |
      npm install --prefix server
      npm install --prefix client
      npm --prefix client run build
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: CLIENT_ORIGIN
        sync: false